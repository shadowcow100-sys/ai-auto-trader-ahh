name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests & build debug APK
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/gradle-build.log; then
            err_summary=$(tail -n 35 /tmp/gradle-build.log | tr '\n' ' ' | sed 's/  */ /g')
            echo "::error::$err_summary"
            exit 1
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTraderAhh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AutoTraderAhh-debug.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release delete android-latest --yes --cleanup-tag
          fi
          gh release create android-latest AutoTraderAhh-debug.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "AutoTrader Ahh Android (Latest Debug APK)" \
            --notes "Direct APK download for Android. Built from commit ${{ github.sha }}."
